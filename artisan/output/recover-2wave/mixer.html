<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTISAN mixer</title>
<style>
  :root { --bg:#12141a; --panel:#1b1e27; --ink:#e8ebf2; --muted:#8b93a7; --accent:#7cc7ff; --win:#2b3a4a; --on:#3a7; --off:#444; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; }
  header { padding:18px 22px; border-bottom:1px solid #262a36; }
  h1 { margin:0 0 4px; font-size:18px; font-weight:650; }
  .sub { color:var(--muted); font-size:13px; }
  .controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:14px 22px; border-bottom:1px solid #262a36; }
  button { background:var(--panel); color:var(--ink); border:1px solid #333846; border-radius:8px; padding:8px 14px; cursor:pointer; font-size:13px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#04121f; border-color:var(--accent); font-weight:600; }
  .stat { color:var(--muted); font-size:13px; margin-left:auto; }
  .stat b { color:var(--ink); }
  .rows { padding:10px 22px 40px; }
  .row { display:flex; align-items:center; gap:12px; padding:7px 0; border-bottom:1px solid #20232e; }
  .toggle { width:44px; height:24px; border-radius:12px; background:var(--off); position:relative; cursor:pointer; flex:0 0 auto; transition:background .15s; }
  .toggle.on { background:var(--on); }
  .knob { position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .15s; }
  .toggle.on .knob { left:22px; }
  .wlabel { width:132px; flex:0 0 auto; font-variant-numeric:tabular-nums; color:var(--muted); }
  .wlabel b { color:var(--ink); }
  canvas.env { flex:1 1 auto; height:34px; width:100%; background:#0e1016; border-radius:6px; }
  .overlay { padding:0 22px 30px; }
  canvas#wave { width:100%; height:150px; background:#0e1016; border-radius:8px; }
  .legend { color:var(--muted); font-size:12px; margin-top:6px; }
  .swatch { display:inline-block; width:11px; height:11px; border-radius:2px; vertical-align:middle; margin:0 4px 0 12px; }
  code { background:#0e1016; padding:2px 6px; border-radius:5px; color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>ARTISAN mixer — <span id="tname"></span></h1>
  <div class="sub">Loops the final render. Toggle any wave to hear it drop out — the page re-renders the genome through the <b>real engine</b>, so what you hear is always the true sound. The shaded band is the scored window.</div>
</header>
<div class="controls">
  <button class="primary" id="play">▶ Play render</button>
  <button id="playTarget">▶ Play target</button>
  <button id="all">All on</button>
  <button id="none">All off</button>
  <div class="stat">SSE now: <b id="sse">—</b> · vs silence <b id="ratio">—</b>× · waves on <b id="count">—</b></div>
</div>
<div class="overlay">
  <canvas id="wave" width="1200" height="150"></canvas>
  <div class="legend"><span class="swatch" style="background:#7cc7ff"></span>current render<span class="swatch" style="background:#e0a</span><span class="swatch" style="background:#e0a75a"></span>target<span class="swatch" style="background:#2b3a4a"></span>scored window</div>
</div>
<div class="rows" id="rows"></div>

<script>
// genome.js — the Creature's genotype (§3).
//
// A genome is 64 wave slots × 95 genes + the global genes. Every gene is stored
// as a float in [0, 1] (§3, first paragraph: "All genes are stored internally as
// floats in [0, 1] and mapped to their declared range on read. Mutation operates
// in stored space. Bounds are handled by reflection, not clamping.").
//
// WHY stored-space [0,1] for everything: it lets one mutation rule (§6.2) apply
// uniformly across genes whose natural units are wildly different — cents,
// seconds, decibels — and it makes "reflect at the bound" a single operation
// rather than per-gene clamping logic. The declared range lives only in the
// mapping table below, so the search never has to know a gene's units.
//
// ─────────────────────────────────────────────────────────────────────────────
// A RECORDED CONTRADICTION IN THE SPEC (see OVERNIGHT-REPORT.md).
// The Appendix gives GLOBAL_GENES = 21 and GENOME_SIZE = 6101, and §2.1 quotes
// 6,101 throughout. But the *enumeration* in §3.2 names 8 non-visual globals
// (fundamental_cents, tempo_bpm, sigma_global, p_duplicate, p_switch_flip_scale,
// n_partners, partner_influence, mutation_fraction) plus 14 visualiser genes = 22.
// 64×95 + 22 = 6102, not 6101. The "22 → 21" bookkeeping for the deleted
// master_gain (vault entity) collided with n_partners being "silently lost and
// restored", leaving the headline count one below the enumerated gene set.
//
// DECISION: implement every gene the spec actually enumerates (22 globals, 6102
// parameters). Dropping an enumerated gene to hit 6101 would remove specified
// function (every visualiser gene "must do something perceptible", §11.1) or a
// load-bearing variation gene — itself a silent narrowing, which is the one
// thing this project forbids. The ±1 difference is a rounding error against the
// 10^14,693 cardinality claim and changes the ES constants only past the 4th
// decimal. Flagged, not silently reconciled.
//
// v2 UPDATE (P1). Two evolvable meta-genes were APPENDED: a per-wave
// `p_ratio_jump_wave` (96 genes per wave now, not 95) and a global
// `p_ratio_jump_scale` (23 globals now, not 22). So GENOME_SIZE = 64×96 + 23 =
// 6167. They were appended, not inserted, so all pre-existing gene indices are
// unchanged and the v1→v2 migration is a simple per-wave/global extension
// (src/migrate.js). P3 separately reparameterised the 3 timing genes in place, so
// their indices are unchanged too.
// ─────────────────────────────────────────────────────────────────────────────

const WAVE_SLOTS = 64;      // §3, Appendix WAVE_SLOTS
const ENV_MAX_NODES = 8;    // §3.1 amplitude/pitch envelopes, Appendix ENV_MAX_NODES

// Gene "kind" drives which mutation operator applies (§6.2 vs §6.2b):
//   'cont'  — continuous, self-adaptive ES additive step
//   'sigma' — a step-size gene; mutates by the log-normal ES rule, not additively
//   'binary'— a kill switch; flips discretely at a per-class rate (§6.2b, §3.3)
//   'int'   — an integer gene (node counts, routing indices); discrete moves
//
// 'map' converts stored [0,1] → declared value. type 'linear' is value =
// lo + s·(hi−lo); type 'log' is value = lo·(hi/lo)^s and REQUIRES lo>0.
//
// WHY some log genes have a tiny positive floor instead of 0 (gain_mod, pm_depth,
// am_depth are declared 0..X but mapped from ~0.001; pre_prop from 1e-6): a log map
// cannot reach 0, and the true "off" for these is provided by a companion switch
// (gain_mod_on, pm_on, am_on) or is sub-perceptual (a pre_prop of 1e-6 period is a
// zero delay). This does not truncate the space in the §2.1 sense — every audible
// value remains reachable and the off-state is reachable via the switch.

function g(name, kind, mapType, lo, hi) {
  return { name, kind, map: { type: mapType, lo, hi } };
}

// Build the 95-gene per-wave schema in a fixed, stable order. Order is arbitrary
// but must never change once logs exist, because a gene is addressed by its
// index in delta storage (§14).
function buildWaveSchema() {
  const s = [];
  // Structural switches — 3 (§3.1). Independent by design: gain_out_on false /
  // gain_mod_on true is a pure modulator (an LFO or FM operator).
  s.push(g('active', 'binary'));
  s.push(g('gain_out_on', 'binary'));
  s.push(g('gain_mod_on', 'binary'));
  // Shape — 8 (§3.1): four continuous weights and a switch each. Output is the
  // sum of enabled shapes weighted by their values, normalised by enabled weight.
  s.push(g('shape_sine', 'cont', 'linear', 0, 1));
  s.push(g('shape_triangle', 'cont', 'linear', 0, 1));
  s.push(g('shape_saw', 'cont', 'linear', 0, 1));
  s.push(g('shape_square', 'cont', 'linear', 0, 1));
  s.push(g('shape_sine_on', 'binary'));
  s.push(g('shape_triangle_on', 'binary'));
  s.push(g('shape_saw_on', 'binary'));
  s.push(g('shape_square_on', 'binary'));
  // Timing — 5. v2 REPARAMETERISATION (P3, V2-PROPOSALS). v1 stored the trio
  // pre_wait / duration / mid_wait directly. v2 stores a PERIOD and a DUTY that
  // splits it into sound and gap, and PRE_PROP (pre_wait as a proportion of the
  // period). Bijective with the v1 trio: period = duration + mid_wait,
  // duty = duration/period, pre_prop = pre_wait/period. WHY (P3): ratio relations
  // *between periods* are what polyrhythm is, so P1/P2 ratio jumps act on the
  // period; mutating the period then scales the whole pattern (same character,
  // different tempo) while mutating duty changes character on a fixed grid — the
  // mutation axes line up with perceptually coherent moves. Still "load-bearing
  // and must not be simplified": the same rhythm/polyrhythm space, re-axed.
  // Positions are unchanged from v1 (period↔pre_wait, duty↔duration,
  // pre_prop↔mid_wait slots), so every later gene index is stable and the delta
  // store (§14) is unaffected. The migration lives in src/migrate.js.
  //   period   log 0.001–150 s   (min = 2×0.5 ms floor; max = 120 + 30 s)
  //   duty     linear 0–1        (fraction of the period that is sound)
  //   pre_prop log 1e-6–1e5      (pre_wait ÷ period; "free to exceed 1", P3). Wide
  //            so migration is loss-free at both extremes (pre 0.5 ms / period 150
  //            → 3e-6; pre 30 s / period 1 ms → 3e4) and no delay is unreachable
  //            (§2.1). Locality cost of the wide range noted in the v2 report; it
  //            is the least consequential timing gene (F4/P4 neutralises the
  //            leading pre_wait anyway).
  s.push(g('period', 'cont', 'log', 0.001, 150));
  s.push(g('duty', 'cont', 'linear', 0, 1));
  s.push(g('pre_prop', 'cont', 'log', 1e-6, 1e5));
  s.push(g('mid_wait_on', 'binary'));                 // off = play once
  s.push(g('phase', 'cont', 'linear', 0, 1));         // wrapping, 0–1
  // Gains — 2 (§3.1). gain_out in dB scales the audio destination; gain_mod
  // scales the modulation destination. Two destinations, one shaped signal.
  s.push(g('gain_out', 'cont', 'linear', -80, 6));    // dB, −80..+6
  s.push(g('gain_mod', 'cont', 'log', 0.001, 32));    // 0..32
  // Amplitude envelope — 34 (§3.1): switch + node count + 8 nodes × 4 fields.
  s.push(g('amp_env_on', 'binary'));
  s.push(g('amp_env_n_nodes', 'int', 'linear', 2, 8));
  for (let k = 0; k < ENV_MAX_NODES; k++) {
    s.push(g(`amp_node${k}_level`, 'cont', 'linear', -80, 24));   // dB
    s.push(g(`amp_node${k}_time`, 'cont', 'linear', 0, 1));       // proportion
    s.push(g(`amp_node${k}_curve`, 'cont', 'linear', -1, 1));
    s.push(g(`amp_node${k}_tension`, 'cont', 'linear', 0, 1));
  }
  // Pitch — 35 (§3.1): identical structure to amp env plus pitch_master. Node
  // levels are cents OFFSETS (±9600). pitch_master is cents above 0.01 Hz.
  s.push(g('pitch_env_on', 'binary'));
  s.push(g('pitch_env_n_nodes', 'int', 'linear', 2, 8));
  s.push(g('pitch_master', 'cont', 'linear', 0, 25100));           // 0.01 Hz – 20 kHz
  for (let k = 0; k < ENV_MAX_NODES; k++) {
    s.push(g(`pitch_node${k}_level`, 'cont', 'linear', -9600, 9600)); // cents
    s.push(g(`pitch_node${k}_time`, 'cont', 'linear', 0, 1));
    s.push(g(`pitch_node${k}_curve`, 'cont', 'linear', -1, 1));
    s.push(g(`pitch_node${k}_tension`, 'cont', 'linear', 0, 1));
  }
  // Modulation — 6 (§3.1). Sources are absolute slot indices (0–63).
  s.push(g('pm_source', 'int', 'linear', 0, 63));
  s.push(g('pm_depth', 'cont', 'log', 0.001, 32));
  s.push(g('pm_on', 'binary'));
  s.push(g('am_source', 'int', 'linear', 0, 63));
  s.push(g('am_depth', 'cont', 'log', 0.001, 8));
  s.push(g('am_on', 'binary'));
  // Per-wave meta — 3 (§3.1 + P1). sigma_wave is a step-size (self-adaptive ES),
  // p_mutate_wave modulates how many of this wave's genes get a draw (§6.2).
  s.push(g('sigma_wave', 'sigma', 'linear', 0.002, 0.5));  // Appendix SIGMA_FLOOR/CEIL
  s.push(g('p_mutate_wave', 'cont', 'linear', 0, 1));
  // p_ratio_jump_wave (P1, V2-PROPOSALS): per-wave probability that a pitch- or
  // time-domain gene, when mutated, takes a STRUCTURED RATIO JUMP onto a simple
  // fraction of the §5 set rather than the ES Gaussian step (§6.2). A self-adaptive
  // meta-gene "in the pattern of sigma_wave / p_mutate_wave" — the search turns the
  // bias up where ratio moves pay and down where they do not, which is the complete
  // answer to the §2.2 worry (a bias the system can evolve away is a prior on moves,
  // not an instrument with an opinion). APPENDED (not inserted) so all earlier
  // per-wave indices are unchanged; the global scale is p_ratio_jump_scale. Init is
  // set in priors.js (the Gate 2b sweep chooses the default). Amplitude/gain genes
  // are out of scope (not periods, P1) and never see a ratio jump.
  s.push(g('p_ratio_jump_wave', 'cont', 'linear', 0, 1));
  return s;
}

// Global genes (§3.2). The 8 non-visual genes are load-bearing; the 14
// visualiser genes are inert in the headless build (no gate reads them) but are
// carried so the genome is complete and the visualiser (§11) can read them.
function buildGlobalSchema() {
  const s = [];
  s.push(g('fundamental_cents', 'cont', 'linear', 0, 25100)); // §5.1(1): range set to the pitch range (see priors.js)
  s.push(g('tempo_bpm', 'cont', 'log', 30, 300));             // §3.2 range; §5.1(5) draw = log-uniform
  s.push(g('sigma_global', 'sigma', 'linear', 0.002, 0.5));   // global step size (§6.2)
  s.push(g('p_duplicate', 'cont', 'linear', 0, 1));           // §6.3 trigger prob (init 0.08)
  s.push(g('p_switch_flip_scale', 'cont', 'linear', 0, 4));   // §6.2b scale on base 0.004; init 1.0 (see priors.js §5.1(8))
  s.push(g('n_partners', 'cont', 'linear', 1, 8));            // §6.8 how MANY partners (init 1.4)
  s.push(g('partner_influence', 'cont', 'linear', 0, 0.5));   // §6.8 how MUCH from partners (init 0.15)
  s.push(g('mutation_fraction', 'cont', 'linear', 0, 1));     // §6.2 proportion of genes drawn
  // 14 visualiser genes (§11). Ranges are the implementer's proposal (§5.1(9),
  // §11.1) — visual only, so provisional and reactable. Recorded in the report.
  s.push(g('hue_base', 'cont', 'linear', 0, 1));
  s.push(g('hue_spread', 'cont', 'linear', 0, 1));
  s.push(g('saturation', 'cont', 'linear', 0, 1));
  s.push(g('luminance_floor', 'cont', 'linear', 0, 0.5));
  s.push(g('ripple_gain', 'cont', 'linear', 0, 1));
  s.push(g('bloom_radius', 'cont', 'linear', 0, 1));
  s.push(g('motion_damping', 'cont', 'linear', 0, 1));
  s.push(g('particle_density', 'cont', 'linear', 0, 1));
  s.push(g('edge_softness', 'cont', 'linear', 0, 1));
  s.push(g('pitch_to_hue_weight', 'cont', 'linear', 0, 1));
  s.push(g('amp_to_scale_weight', 'cont', 'linear', 0, 1));
  s.push(g('symmetry_order', 'int', 'linear', 1, 8));
  s.push(g('field_blend_mode', 'int', 'linear', 0, 3));
  s.push(g('background_drift', 'cont', 'linear', 0, 1));
  // p_ratio_jump_scale (P1, V2-PROPOSALS): the GLOBAL SCALE on the per-wave
  // p_ratio_jump_wave (effective per-wave probability = wave × scale, clamped to
  // [0,1]) — same shape as p_switch_flip_scale scaling the per-class switch rate
  // (§6.2b). It also governs the two global pitch/time genes (fundamental_cents,
  // tempo_bpm). Evolvable; init 1.0 (neutral). APPENDED at the end so v1→v2
  // migration only adds one global (src/migrate.js).
  s.push(g('p_ratio_jump_scale', 'cont', 'linear', 0, 4));
  return s;
}

const WAVE_SCHEMA = buildWaveSchema();
const GLOBAL_SCHEMA = buildGlobalSchema();
const GENES_PER_WAVE = WAVE_SCHEMA.length;          // 95
const GLOBAL_COUNT = GLOBAL_SCHEMA.length;          // 22 (see contradiction note above)
const GENOME_SIZE = WAVE_SLOTS * GENES_PER_WAVE + GLOBAL_COUNT;

// Fast name → within-wave index, and name → global index.
const WAVE_INDEX = Object.fromEntries(WAVE_SCHEMA.map((d, i) => [d.name, i]));
const GLOBAL_INDEX = Object.fromEntries(GLOBAL_SCHEMA.map((d, i) => [d.name, i]));

// Which of the 95 per-wave genes are the 12 kill switches (§3.3): active,
// gain_out_on, gain_mod_on, 4 shape switches, mid_wait_on, amp_env_on,
// pitch_env_on, pm_on, am_on = 12 per wave, 768 total.
const SWITCH_NAMES = [
  'active', 'gain_out_on', 'gain_mod_on',
  'shape_sine_on', 'shape_triangle_on', 'shape_saw_on', 'shape_square_on',
  'mid_wait_on', 'amp_env_on', 'pitch_env_on', 'pm_on', 'am_on',
];
const SWITCH_WAVE_INDICES = SWITCH_NAMES.map((n) => WAVE_INDEX[n]);

// Reflect a value into [0,1] at the bounds (§3: "reflection, not clamping").
// WHY reflection: clamping piles probability mass onto the exact boundary, which
// biases genes that mutate near a bound toward that bound. Reflection preserves
// the step distribution's shape and keeps the walk exploratory at the edges.
function reflect01(v) {
  // Handle arbitrarily large excursions by folding repeatedly.
  if (v >= 0 && v <= 1) return v;
  // Map into a period-2 triangle wave with peaks at 0 and 1.
  let x = Math.abs(v) % 2;
  return x <= 1 ? x : 2 - x;
}

// The genome itself. A flat Float32Array keeps memory tight (~24 KB, §12) and
// makes delta storage (§14) a simple index/value scan.
class Genome {
  constructor() {
    this.data = new Float32Array(GENOME_SIZE);
    // Metadata carried alongside the raw genes but not part of the 6,10x count.
    // These are needed by fitness/provenance (§8.2) and logging (§14) and are
    // set by the variation pipeline at birth.
    this.id = null;              // content hash, assigned lazily (see hash())
    this.src = null;             // Int8Array[64]: which parent supplied each slot (§6.8)
    this.contrib = null;         // { ancestorId: inheritedFraction } (§8.2)
    this.parentIds = [];         // prime parent first, then partners
  }

  // Stored value of the wth wave's named gene.
  getWaveStored(w, name) {
    return this.data[w * GENES_PER_WAVE + WAVE_INDEX[name]];
  }
  setWaveStored(w, name, v) {
    this.data[w * GENES_PER_WAVE + WAVE_INDEX[name]] = reflect01(v);
  }
  getGlobalStored(name) {
    return this.data[WAVE_SLOTS * GENES_PER_WAVE + GLOBAL_INDEX[name]];
  }
  setGlobalStored(name, v) {
    this.data[WAVE_SLOTS * GENES_PER_WAVE + GLOBAL_INDEX[name]] = reflect01(v);
  }

  // Mapped (declared-unit) value of a per-wave gene.
  getWave(w, name) {
    const d = WAVE_SCHEMA[WAVE_INDEX[name]];
    return mapValue(d, this.data[w * GENES_PER_WAVE + WAVE_INDEX[name]]);
  }
  getGlobal(name) {
    const d = GLOBAL_SCHEMA[GLOBAL_INDEX[name]];
    return mapValue(d, this.data[WAVE_SLOTS * GENES_PER_WAVE + GLOBAL_INDEX[name]]);
  }

  // Is the wth wave's named switch on? on = stored ≥ 0.5.
  isOn(w, name) {
    return this.data[w * GENES_PER_WAVE + WAVE_INDEX[name]] >= 0.5;
  }

  clone() {
    const c = new Genome();
    c.data.set(this.data);
    // src/contrib/parentIds are re-established by the variation pipeline; a raw
    // clone (used by mutation-only breeding before provenance is set) copies none.
    return c;
  }

  // A stable content hash of the raw gene array, used as genome_id (§14) and by
  // the repeat cooldown (§8.5). FNV-1a over the Float32Array's bytes.
  hash() {
    const bytes = new Uint8Array(this.data.buffer);
    let h = 0x811c9dc5;
    for (let i = 0; i < bytes.length; i++) {
      h ^= bytes[i];
      h = Math.imul(h, 0x01000193);
    }
    // Return as an unsigned hex string.
    return (h >>> 0).toString(16).padStart(8, '0');
  }
}

// Map a stored [0,1] value to its declared range for a given gene descriptor.
function mapValue(d, stored) {
  const s = reflect01(stored); // defensive: stored should already be in range
  const { type, lo, hi } = d.map || {};
  if (d.kind === 'binary') return s >= 0.5 ? 1 : 0;
  if (d.kind === 'int') {
    // n distinct integers lo..hi inclusive; split [0,1] into (hi-lo+1) bins.
    const n = hi - lo + 1;
    let v = lo + Math.floor(s * n);
    if (v > hi) v = hi; // s can be exactly 1.0 after reflection
    return v;
  }
  if (type === 'log') {
    // value = lo · (hi/lo)^s. lo>0 guaranteed by the schema for log genes.
    return lo * Math.pow(hi / lo, s);
  }
  // linear (also covers dB / cents / proportion / curve / tension — same map,
  // different unit label; the unit conversion happens at point of use).
  return lo + s * (hi - lo);
}

// Inverse of mapValue: declared value → stored [0,1]. Used by the priors (§5)
// to set genes from natural units (Hz, dB, seconds) and by any code that wants
// to write a specific declared value. For int genes it returns the bin CENTRE so
// the value round-trips through mapValue.
function inverseMap(d, value) {
  const { type, lo, hi } = d.map || {};
  if (d.kind === 'binary') return value ? 1 : 0;
  if (d.kind === 'int') {
    const n = hi - lo + 1;
    const v = Math.max(lo, Math.min(hi, Math.round(value)));
    return (v - lo + 0.5) / n; // bin centre
  }
  if (type === 'log') {
    const clamped = Math.max(lo, Math.min(hi, value));
    return Math.log(clamped / lo) / Math.log(hi / lo);
  }
  const clamped = Math.max(lo, Math.min(hi, value));
  return (clamped - lo) / (hi - lo);
}

// Convenience for tests / logging: number of not-kill switches that are "on",
// i.e. the complexity measure used by parsimony (§7.4) and logged as `complexity`
// (§14.1). "Complexity = count of not-kill switches" (vault). We read it as the
// count of switches currently ON, since that is what expresses structure.
function complexity(genome) {
  let c = 0;
  for (let w = 0; w < WAVE_SLOTS; w++) {
    for (const name of SWITCH_NAMES) {
      if (genome.isOn(w, name)) c++;
    }
  }
  return c;
}


// synthesis.js — GENOME → SAMPLES (§4). Deterministic, many-to-one, headless.
//
// This is the AUDIO engine minus the audio: it fills a Float32Array with the raw
// mixed output (Σ out[i], §4.2). Loudness normalisation (§4.7) is applied
// afterwards by loudness.js, and everything downstream — descriptors, perceptual
// distance, the visualiser — reads the NORMALISED buffer (§4.7). Keeping this
// module DOM-free is what lets Gates 2a/2b run under plain node (README).
//
// The per-sample recurrence is exactly §4.2. The only subtlety is modulation
// routing (§4.3): a wave may modulate another, cycles are allowed (including
// self-modulation), and a back-edge in the routing graph reads its source's
// value from the PREVIOUS sample (δ = 1) so the recurrence stays computable.



const TWO_PI = Math.PI * 2;

function dB2lin(dB) {
  return Math.pow(10, dB / 20);
}

// Shape family (§3.1). `p` is a phase in CYCLES; only its fractional part matters.
// Output is the sum of enabled shapes weighted by their gene values, normalised
// by the enabled-weight sum (§3.1). All disabled / all-zero → silence.
function shapeValue(p, dec) {
  const frac = p - Math.floor(p);
  let sum = 0;
  const w = dec.shapeW;
  if (dec.shapeOn[0]) sum += w[0] * Math.sin(TWO_PI * p);               // sine
  if (dec.shapeOn[1]) sum += w[1] * (1 - 4 * Math.abs(frac - 0.5));      // triangle
  if (dec.shapeOn[2]) sum += w[2] * (2 * frac - 1);                      // saw
  if (dec.shapeOn[3]) sum += w[3] * (frac < 0.5 ? 1 : -1);              // square
  return dec.shapeWSum > 0 ? sum / dec.shapeWSum : 0;
}

// Envelope curve shape (§3.1): y = x^(2^curve), with `tension` blending between
// that ease and its mirror so convex/linear/concave and their asymmetries lie on
// one continuum. x, output in [0,1].
function curveShape(x, curve, tension) {
  if (x <= 0) return 0;
  if (x >= 1) return 1;
  const exp = Math.pow(2, curve);           // curve∈[−1,1] → exp∈[0.5,2]
  const ease = Math.pow(x, exp);
  const mirror = 1 - Math.pow(1 - x, exp);
  return (1 - tension) * ease + tension * mirror;
}

// Piecewise envelope over normalised render time t∈[0,1]. `nodes` is {level[],
// time[], curve[], tension[], n}. Node positions are the sum-normalised cumulative
// `time` proportions (§3.1: "normalised by the sum across active nodes"), so
// mutating one time redistributes the rest rather than sliding off the end.
function envValue(t, nodes) {
  const n = nodes.n;
  const pos = nodes.pos; // precomputed cumulative-normalised positions, length n
  if (t <= pos[0]) return nodes.level[0];
  if (t >= pos[n - 1]) return nodes.level[n - 1];
  // Find the segment [pos[j], pos[j+1]] containing t. n≤8 so a linear scan is fine.
  let j = 0;
  while (j < n - 1 && t > pos[j + 1]) j++;
  const span = pos[j + 1] - pos[j];
  const x = span > 1e-9 ? (t - pos[j]) / span : 0;
  const shaped = curveShape(x, nodes.curve[j], nodes.tension[j]);
  return nodes.level[j] + (nodes.level[j + 1] - nodes.level[j]) * shaped;
}

// Decode one wave's genes into a fast per-sample struct. Called once per render.
// `timingOverride` (P3-mig gate only) is {preS,durS,midS} in seconds, bypassing the
// period/duty/pre_prop decode so the v1 side can be rendered without v1 synthesis.
function decodeWave(gn, w, sampleRate, timingOverride) {
  const base = w * WAVE_SCHEMA.length;
  const raw = (name) => gn.data[base + WAVE_INDEX[name]];
  const val = (name) => gn.getWave(w, name);

  const dec = {};
  dec.gainOutLin = (raw('gain_out_on') >= 0.5) ? dB2lin(val('gain_out')) : 0;
  dec.gainMod = (raw('gain_mod_on') >= 0.5) ? val('gain_mod') : 0;

  dec.shapeOn = [
    raw('shape_sine_on') >= 0.5, raw('shape_triangle_on') >= 0.5,
    raw('shape_saw_on') >= 0.5, raw('shape_square_on') >= 0.5,
  ];
  dec.shapeW = [val('shape_sine'), val('shape_triangle'), val('shape_saw'), val('shape_square')];
  dec.shapeWSum = 0;
  for (let k = 0; k < 4; k++) if (dec.shapeOn[k]) dec.shapeWSum += dec.shapeW[k];

  dec.phase0 = val('phase');
  dec.pitchMaster = val('pitch_master');

  // Timing gate in samples (§4.2). v2 (P3): reconstruct the pre_wait/duration/
  // mid_wait SECONDS from period/duty/pre_prop, then the gate logic below is
  // exactly as v1. `timingOverride` (used only by the P3 migration gate) supplies
  // seconds directly, so the gate can render the v1 side without a v1 synthesis.
  let preS, durS, midS;
  if (timingOverride) {
    preS = timingOverride.preS; durS = timingOverride.durS; midS = timingOverride.midS;
  } else {
    const period = val('period');
    const duty = val('duty');
    durS = duty * period;            // sound portion
    midS = (1 - duty) * period;      // gap portion
    preS = val('pre_prop') * period; // pre_wait as a proportion of the period (P3)
  }
  dec.preSamp = Math.max(0, Math.round(preS * sampleRate));
  dec.durSamp = Math.max(1, Math.round(durS * sampleRate));
  dec.midSamp = Math.max(1, Math.round(midS * sampleRate));
  dec.midOn = raw('mid_wait_on') >= 0.5;

  // Amp / pitch envelopes.
  dec.ampOn = raw('amp_env_on') >= 0.5;
  dec.pitchOn = raw('pitch_env_on') >= 0.5;
  dec.ampNodes = decodeNodes(gn, w, 'amp', val('amp_env_n_nodes'));
  dec.pitchNodes = decodeNodes(gn, w, 'pitch', val('pitch_env_n_nodes'));

  // Modulation.
  dec.pmOn = raw('pm_on') >= 0.5;
  dec.amOn = raw('am_on') >= 0.5;
  dec.pmSource = val('pm_source');
  dec.amSource = val('am_source');
  dec.pmDepth = val('pm_depth');
  dec.amDepth = val('am_depth');

  dec.phaseAcc = 0; // running phase accumulator in cycles
  return dec;
}

function decodeNodes(gn, w, kind, nNodes) {
  const n = Math.max(2, Math.min(ENV_MAX_NODES, nNodes));
  const level = new Float64Array(n), time = new Float64Array(n),
    curve = new Float64Array(n), tension = new Float64Array(n);
  for (let k = 0; k < n; k++) {
    level[k] = gn.getWave(w, `${kind}_node${k}_level`);
    time[k] = gn.getWave(w, `${kind}_node${k}_time`);
    curve[k] = gn.getWave(w, `${kind}_node${k}_curve`);
    tension[k] = gn.getWave(w, `${kind}_node${k}_tension`);
  }
  // Cumulative-normalised positions in [0,1].
  const pos = new Float64Array(n);
  let acc = 0, total = 0;
  for (let k = 0; k < n; k++) total += Math.max(1e-6, time[k]);
  for (let k = 0; k < n; k++) { acc += Math.max(1e-6, time[k]); pos[k] = acc / total; }
  return { level, time, curve, tension, n, pos };
}

// Build the modulation routing order (§4.3). Returns:
//   order   — active-wave indices in an evaluation order where forward-edge
//             sources precede the waves that read them;
//   delayed — a Set of "reader,source" pairs that are back-edges (δ=1);
//   nBackEdges — count, logged as an anomaly diagnostic (§14.6).
// WHY DFS with grey/back-edge marking: it is the standard, cheap way to give a
// cyclic graph a well-defined per-sample update — cycles are permitted and
// musically wanted (§4.3, self-modulation → saw/noise), they just cost one
// sample of delay on the edge that closes the loop.
function buildRoutingOrder(decoded, activeSet) {
  const color = new Map();   // slot → 'grey' | 'black'
  const order = [];
  const delayed = new Set();
  let nBackEdges = 0;

  function inputsOf(i) {
    const d = decoded[i];
    const ins = [];
    if (d.pmOn && activeSet.has(d.pmSource)) ins.push(d.pmSource);
    if (d.amOn && activeSet.has(d.amSource)) ins.push(d.amSource);
    return ins;
  }

  // Iterative DFS to avoid stack limits (up to 64 nodes is small, but keep it safe).
  function visit(start) {
    const stack = [{ node: start, ins: inputsOf(start), idx: 0 }];
    color.set(start, 'grey');
    while (stack.length) {
      const frame = stack[stack.length - 1];
      if (frame.idx < frame.ins.length) {
        const s = frame.ins[frame.idx++];
        const c = color.get(s);
        if (c === undefined) {
          color.set(s, 'grey');
          stack.push({ node: s, ins: inputsOf(s), idx: 0 });
        } else if (c === 'grey') {
          // Back edge: `frame.node` depends on `s`, an ancestor still on the stack.
          delayed.add(frame.node + ',' + s);
          nBackEdges++;
        }
        // black → forward/cross edge, already ordered, nothing to do.
      } else {
        color.set(frame.node, 'black');
        order.push(frame.node);
        stack.pop();
      }
    }
  }

  for (const i of activeSet) if (color.get(i) === undefined) visit(i);
  return { order, delayed, nBackEdges };
}

// Render a genome to raw samples.
//   opts.sampleRate  — 44100 for audio, 22050 for descriptors (§12)
//   opts.lengthS     — render length in seconds (the servo's L, or a gate value)
//   opts.captureVisEnv — if true, also return a 60 Hz per-wave amplitude envelope
//                        for the visualiser fast channel (§11). Off for gates.
// Returns { samples, sampleRate, lengthS, activeWaves, nBackEdges, samplePeak,
//           clipped, hasFeedbackCycle, visEnv?, visEnvHz?, renderError }.
function render(gn, opts = {}) {
  const sampleRate = opts.sampleRate || 44100;
  const lengthS = opts.lengthS || 60;
  const N = Math.max(1, Math.round(lengthS * sampleRate));
  const samples = new Float32Array(N);

  // Decode only ACTIVE waves; inactive slots contribute nothing (§4.2, `active[i]`
  // factor) and act as constant-0 modulation sources.
  const decoded = {};
  const activeSet = new Set();
  const timingSecondsOverride = opts.timingSecondsOverride || null; // P3-mig gate only
  for (let w = 0; w < WAVE_SLOTS; w++) {
    if (gn.getWave(w, 'active') >= 0.5) {
      decoded[w] = decodeWave(gn, w, sampleRate, timingSecondsOverride ? timingSecondsOverride[w] : null);
      activeSet.add(w);
    }
  }
  const activeWaves = activeSet.size;

  const routing = buildRoutingOrder(decoded, activeSet);
  const order = routing.order;

  // Modulation-signal buffers, indexed by absolute slot (§4.2 modsig[]).
  const modCur = new Float64Array(WAVE_SLOTS);
  const modPrev = new Float64Array(WAVE_SLOTS);

  // Precompute, per wave in `order`, whether its pm/am edges are delayed.
  for (const i of order) {
    const d = decoded[i];
    d.pmDelayed = routing.delayed.has(i + ',' + d.pmSource);
    d.amDelayed = routing.delayed.has(i + ',' + d.amSource);
    d.pmSourceActive = activeSet.has(d.pmSource);
    d.amSourceActive = activeSet.has(d.amSource);
  }

  // Optional 60 Hz per-wave visual envelope (§11 fast channel). One value per
  // active wave per 1/60 s frame; captured free during synthesis.
  let visEnv = null, visHopSamp = 0, visFrames = 0;
  const VIS_HZ = 60;
  if (opts.captureVisEnv) {
    visHopSamp = Math.max(1, Math.round(sampleRate / VIS_HZ));
    visFrames = Math.ceil(N / visHopSamp);
    visEnv = {}; // slot → Float32Array(visFrames)
    for (const i of order) visEnv[i] = new Float32Array(visFrames);
  }

  let renderError = null;
  let peak = 0;
  let clipped = false;

  try {
    const invSR = 1 / sampleRate;
    for (let n = 0; n < N; n++) {
      const t = N > 1 ? n / (N - 1) : 0; // normalised render position for envelopes
      let out = 0;

      for (let oi = 0; oi < order.length; oi++) {
        const i = order[oi];
        const d = decoded[i];

        // Pitch → frequency → phase accumulation (§4.2).
        let cents = d.pitchMaster;
        if (d.pitchOn) cents += envValue(t, d.pitchNodes);
        const freq = 0.01 * Math.pow(2, cents / 1200);
        d.phaseAcc += freq * invSR;

        // Amplitude envelope (multiplicative, §4.4). Levels are dB → linear.
        const env = d.ampOn ? dB2lin(envValue(t, d.ampNodes)) : 1;

        // Gate (§4.2): pre_wait silence, duration on, mid_wait off, repeating
        // while mid_wait_on.
        let gate;
        if (n < d.preSamp) gate = 0;
        else {
          const local = n - d.preSamp;
          if (!d.midOn) gate = local < d.durSamp ? 1 : 0;
          else {
            const period = d.durSamp + d.midSamp;
            gate = (local % period) < d.durSamp ? 1 : 0;
          }
        }

        // Phase modulation (§4.1: PM not FM). mod_phase is in cycles, matching the
        // phase accumulator's units (§4.2 writes `phase[i] + mod_phase`).
        let modPhase = 0;
        if (d.pmOn && d.pmSourceActive) {
          const src = d.pmDelayed ? modPrev[d.pmSource] : modCur[d.pmSource];
          modPhase = d.pmDepth * src;
        }
        const raw = shapeValue(d.phaseAcc + d.phase0 + modPhase, d);

        // Amplitude modulation (multiplicative, clamped ≥0 per §4.2).
        let am = 1;
        if (d.amOn && d.amSourceActive) {
          const src = d.amDelayed ? modPrev[d.amSource] : modCur[d.amSource];
          am = Math.max(0, 1 + d.amDepth * src);
        }

        const activity = raw * env * gate;
        modCur[i] = activity * d.gainMod;       // modsig[i] (§4.2); gainMod=0 if off
        out += activity * d.gainOutLin * am;    // out[i] (§4.2); gainOutLin=0 if off

        if (visEnv && (n % visHopSamp) === 0) {
          visEnv[i][(n / visHopSamp) | 0] = Math.abs(activity * d.gainOutLin);
        }
      }

      samples[n] = out;
      const a = Math.abs(out);
      if (a > peak) peak = a;
      if (a > 1) clipped = true; // pre-normalisation clip flag (§14.1 sample_peak/clipped)

      // Advance the one-sample delay line for back-edges.
      modPrev.set(modCur);
    }
  } catch (e) {
    // Synthesis must never take the whole run down; a failed render is logged as
    // an anomaly (§14.6) and the Creature is skipped by the caller.
    renderError = String(e && e.message ? e.message : e);
  }

  // Guard against NaN/Inf leaking into descriptors or the audio device (§14.6).
  let hadNonFinite = false;
  for (let n = 0; n < N; n++) {
    if (!Number.isFinite(samples[n])) { samples[n] = 0; hadNonFinite = true; }
  }

  return {
    samples, sampleRate, lengthS, N,
    activeWaves,
    nBackEdges: routing.nBackEdges,
    hasFeedbackCycle: routing.nBackEdges > 0,
    samplePeak: peak,
    clipped,
    hadNonFinite,
    visEnv, visEnvHz: VIS_HZ, visFrames,
    renderError,
  };
}


// genome-string.js — P11 genome ⇄ text string (owner brief, step 4).
//
// Format (shared with the main project's P11 proposal, docs/V2-PROPOSALS.md):
//
//     PG2:<base64 of the little-endian Float32 gene array>
//
// The "PG2" tag is BOTH the format version AND the schema generation: it means
// "Playing God schema v2" — the current 6167-gene genome (64×96 per-wave + 23
// globals; see ../src/genome.js). The tag is MANDATORY (the brief: "schema will
// change; the P3 migration is precedent"). A future schema bump becomes "PG3:"
// and this decoder rejects it loudly rather than mis-loading.
//
// Portability: this module is imported by BOTH node (run.js) and the browser
// (app.html), so it does not use Buffer or btoa/atob. Bytes are written
// little-endian via DataView (deterministic on any platform) and base64 is
// hand-rolled. Encode→decode round-trips a genome bit-exactly.



const TAG = 'PG2';
const PREFIX = TAG + ':';

const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
const B64_INV = (() => { const m = new Int16Array(128).fill(-1); for (let i = 0; i < B64.length; i++) m[B64.charCodeAt(i)] = i; return m; })();

// bytes (Uint8Array) → base64 string. Standard MIME base64 with '=' padding.
function bytesToBase64(bytes) {
  let out = '';
  const n = bytes.length;
  let i = 0;
  for (; i + 2 < n; i += 3) {
    const b = (bytes[i] << 16) | (bytes[i + 1] << 8) | bytes[i + 2];
    out += B64[(b >> 18) & 63] + B64[(b >> 12) & 63] + B64[(b >> 6) & 63] + B64[b & 63];
  }
  const rem = n - i;
  if (rem === 1) {
    const b = bytes[i] << 16;
    out += B64[(b >> 18) & 63] + B64[(b >> 12) & 63] + '==';
  } else if (rem === 2) {
    const b = (bytes[i] << 16) | (bytes[i + 1] << 8);
    out += B64[(b >> 18) & 63] + B64[(b >> 12) & 63] + B64[(b >> 6) & 63] + '=';
  }
  return out;
}

// base64 string → Uint8Array. Ignores whitespace; tolerant of missing padding.
function base64ToBytes(str) {
  const s = str.replace(/[^A-Za-z0-9+/=]/g, '');
  const len = s.indexOf('=') === -1 ? s.length : s.indexOf('=');
  const outLen = Math.floor((len * 6) / 8);
  const out = new Uint8Array(outLen);
  let bits = 0, acc = 0, o = 0;
  for (let i = 0; i < len; i++) {
    const v = B64_INV[s.charCodeAt(i)];
    if (v < 0) throw new Error('genome string: invalid base64 character');
    acc = (acc << 6) | v;
    bits += 6;
    if (bits >= 8) { bits -= 8; out[o++] = (acc >> bits) & 0xff; }
  }
  return out;
}

// Genome (or raw Float32Array of GENOME_SIZE genes) → "PG2:…" string.
function encodeGenomeString(genomeOrData) {
  const data = genomeOrData instanceof Float32Array ? genomeOrData
    : (genomeOrData && genomeOrData.data instanceof Float32Array ? genomeOrData.data : null);
  if (!data) throw new Error('encodeGenomeString: expected a Genome or Float32Array');
  if (data.length !== GENOME_SIZE) {
    throw new Error(`encodeGenomeString: gene array length ${data.length} != GENOME_SIZE ${GENOME_SIZE}`);
  }
  const bytes = new Uint8Array(data.length * 4);
  const view = new DataView(bytes.buffer);
  for (let i = 0; i < data.length; i++) view.setFloat32(i * 4, data[i], true); // little-endian
  return PREFIX + bytesToBase64(bytes);
}

// "PG2:…" string → Genome. Validates the tag and the gene count. Reconstructs the
// provenance metadata as a fresh root (all-prime src, id = content hash).
function decodeGenomeString(str) {
  if (typeof str !== 'string') throw new Error('decodeGenomeString: expected a string');
  const trimmed = str.trim();
  const colon = trimmed.indexOf(':');
  if (colon < 0) throw new Error('genome string: missing "TAG:" prefix');
  const tag = trimmed.slice(0, colon);
  if (tag !== TAG) {
    throw new Error(`genome string: unsupported version tag "${tag}" (this build reads "${TAG}"). ` +
      `A newer/older schema needs its migration path — refusing to mis-load.`);
  }
  const bytes = base64ToBytes(trimmed.slice(colon + 1));
  if (bytes.length !== GENOME_SIZE * 4) {
    throw new Error(`genome string: decoded ${bytes.length} bytes, expected ${GENOME_SIZE * 4} ` +
      `(${GENOME_SIZE} float32 genes). Corrupt or wrong-schema string.`);
  }
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const g = new Genome();
  for (let i = 0; i < GENOME_SIZE; i++) g.data[i] = view.getFloat32(i * 4, true);
  g.src = new Int8Array(WAVE_SLOTS);   // all-prime root
  g.parentIds = [];
  g.contrib = {};
  g.id = g.hash();
  return g;
}

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA";

function b64ToF32(b64){ const bin=atob(b64); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i); return new Float32Array(bytes.buffer); }
const TARGET = b64ToF32(TARGET_B64);

const baseGenome = decodeGenomeString(GENOME_STR);
const enabled = new Map(META.activeSlots.map(s=>[s,true]));

function buildGenome(){
  const g = baseGenome.clone();
  for(const s of META.activeSlots) g.setWaveStored(s,'active', enabled.get(s)?1:0);
  return g;
}
function renderFull(g){
  const r = render(g,{sampleRate:META.sampleRate,lengthS:META.renderLengthS});
  return r.samples;
}
function windowed(samples){
  const out=new Float32Array(META.winLen);
  for(let i=0;i<META.winLen;i++){const s=samples[META.startSample+i]; out[i]=s===undefined?0:s;}
  return out;
}
function sseOf(win){ let s=0; for(let i=0;i<META.winLen;i++){const d=win[i]-TARGET[i]; s+=d*d;} return s; }

// audio
let ac=null, srcNode=null, curBuf=null, playing=false, playingTarget=false;
function ensureAC(){ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); return ac; }
function toAudioBuffer(samples, rate){ const ac=ensureAC(); const b=ac.createBuffer(1,samples.length,rate); b.copyToChannel(Float32Array.from(samples),0); return b; }
function stop(){ if(srcNode){try{srcNode.stop()}catch(e){} srcNode=null;} playing=false; playingTarget=false; document.getElementById('play').textContent='▶ Play render'; document.getElementById('playTarget').textContent='▶ Play target'; }
function loop(buf){ const ac=ensureAC(); stop(); srcNode=ac.createBufferSource(); srcNode.buffer=buf; srcNode.loop=true; srcNode.connect(ac.destination); srcNode.start(); }

let curSamples=null;
function refresh(){
  const g=buildGenome();
  curSamples=renderFull(g);
  const win=windowed(curSamples);
  const sse=sseOf(win);
  document.getElementById('sse').textContent = sse.toExponential(3);
  document.getElementById('ratio').textContent = (META.silenceFloor/sse).toExponential(2);
  let on=0; for(const v of enabled.values()) if(v) on++;
  document.getElementById('count').textContent = on+' / '+META.activeSlots.length;
  drawWave(win);
  if(playing){ curBuf=toAudioBuffer(curSamples,META.sampleRate); loop(curBuf); document.getElementById('play').textContent='⏸ Stop'; }
}

// per-wave amplitude envelope (solo render), scored-window shaded
function drawEnv(canvas, slot){
  const g=baseGenome.clone();
  for(const s of META.activeSlots) g.setWaveStored(s,'active', s===slot?1:0);
  const samples=renderFull(g);
  const ctx=canvas.getContext('2d'); const W=canvas.width=canvas.clientWidth||600, H=canvas.height=34;
  ctx.clearRect(0,0,W,H);
  // shade scored window
  const N=samples.length; const x0=Math.floor(W*META.startSample/N), x1=Math.ceil(W*(META.startSample+META.winLen)/N);
  ctx.fillStyle='#2b3a4a'; ctx.fillRect(x0,0,x1-x0,H);
  // envelope (peak per column)
  ctx.strokeStyle='#7cc7ff'; ctx.beginPath();
  const step=Math.max(1,Math.floor(N/W));
  for(let x=0;x<W;x++){ let pk=0; const b=Math.floor(x*N/W); for(let k=0;k<step;k++){const v=Math.abs(samples[b+k]||0); if(v>pk)pk=v;} const y=H-Math.min(1,pk)*H; if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y); }
  ctx.stroke();
}

function drawWave(win){
  const c=document.getElementById('wave'); const ctx=c.getContext('2d'); const W=c.width=c.clientWidth, H=c.height=150;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#2b3a4a'; ctx.fillRect(0,0,W,H); // whole panel is the scored window
  const mid=H/2; const N=win.length; const step=Math.max(1,Math.floor(N/W));
  // target (amber)
  ctx.strokeStyle='#e0a75a'; ctx.globalAlpha=0.8; ctx.beginPath();
  for(let x=0;x<W;x++){ const b=Math.floor(x*N/W); let v=TARGET[b]||0; const y=mid-v*mid*0.95; if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);} ctx.stroke();
  // render (blue)
  ctx.strokeStyle='#7cc7ff'; ctx.globalAlpha=0.9; ctx.beginPath();
  for(let x=0;x<W;x++){ const b=Math.floor(x*N/W); let v=win[b]||0; const y=mid-v*mid*0.95; if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);} ctx.stroke();
  ctx.globalAlpha=1;
}

// build rows
function fmtFreq(slot){ const cents=baseGenome.getWave(slot,'pitch_master'); const f=0.01*Math.pow(2,cents/1200); const shapes=['sine','triangle','saw','square'].filter(s=>baseGenome.isOn(slot,'shape_'+s+'_on')); return {f, shapes}; }
function buildRows(){
  const rows=document.getElementById('rows');
  for(const slot of META.activeSlots){
    const {f,shapes}=fmtFreq(slot);
    const row=document.createElement('div'); row.className='row';
    const tog=document.createElement('div'); tog.className='toggle on'; tog.innerHTML='<div class="knob"></div>';
    tog.onclick=()=>{ const now=!enabled.get(slot); enabled.set(slot,now); tog.classList.toggle('on',now); refresh(); };
    const lab=document.createElement('div'); lab.className='wlabel'; lab.innerHTML='<b>wave '+slot+'</b><br>'+f.toFixed(f<10?3:1)+' Hz · '+(shapes.join('+')||'—');
    const cv=document.createElement('canvas'); cv.className='env';
    row.appendChild(tog); row.appendChild(lab); row.appendChild(cv);
    rows.appendChild(row);
    requestAnimationFrame(()=>drawEnv(cv,slot));
  }
}

document.getElementById('tname').textContent = META.name;
document.getElementById('play').onclick=()=>{ if(playing){stop();} else { playing=true; playingTarget=false; curBuf=toAudioBuffer(curSamples,META.sampleRate); loop(curBuf); document.getElementById('play').textContent='⏸ Stop'; } };
document.getElementById('playTarget').onclick=()=>{ if(playingTarget){stop();} else { stop(); playingTarget=true; loop(toAudioBuffer(TARGET,META.sampleRate)); document.getElementById('playTarget').textContent='⏸ Stop'; } };
document.getElementById('all').onclick=()=>{ for(const s of META.activeSlots)enabled.set(s,true); document.querySelectorAll('.toggle').forEach(t=>t.classList.add('on')); refresh(); };
document.getElementById('none').onclick=()=>{ for(const s of META.activeSlots)enabled.set(s,false); document.querySelectorAll('.toggle').forEach(t=>t.classList.remove('on')); refresh(); };

buildRows();
refresh();
window.addEventListener('resize',()=>{ if(curSamples)drawWave(windowed(curSamples)); document.querySelectorAll('.row').forEach((r,i)=>drawEnv(r.querySelector('canvas'),META.activeSlots[i])); });
</script>
